<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCT Tournament Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        vct: {
                            bg: '#0b0e14',
                            card: '#090d16',
                            border: '#1e293b',
                            red: '#ff4655',
                            cyan: '#06b6d4',
                            darker: '#06080d'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Teko & Titillium Web -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0e14;
            font-family: 'Titillium Web', sans-serif;
            color: #e2e8f0;
        }
        .font-teko {
            font-family: 'Teko', sans-serif;
        }
        /* VCT BRACKET STYLING */
        .bracket-wrapper {
            display: flex;
            align-items: center;
            gap: 3rem;
            position: relative;
            padding: 1rem 0;
            overflow-x: auto;
        }
        .bracket-col {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 2rem;
            position: relative;
            z-index: 2;
        }
        .vct-match-card {
            width: 270px;
            background: #090d16;
            border: 1px solid #1e293b;
            border-left: 3px solid #334155;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
        }
        .vct-match-card.active {
            border-left-color: #ff4655;
            box-shadow: 0 0 15px rgba(255, 70, 85, 0.25);
        }
        .vct-match-card.ready {
            border-left-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-500 selection:text-white">

    <!-- HEADER / NAVBAR -->
    <header class="bg-vct-darker border-b border-vct-border px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="w-3 h-3 bg-red-600 inline-block transform skew-x-[-12deg]"></span>
            <h1 class="font-teko text-2xl tracking-wider uppercase font-bold text-white">VCT Knockout Portal</h1>
        </div>
        <div id="userProfileArea" class="flex items-center gap-4 text-xs font-mono">
            <span id="txtCurrentUser" class="text-slate-400">Đang tải...</span>
            <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded transition uppercase tracking-wider font-bold">Đăng xuất</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">

        <!-- ADMIN CONTROLS (ẩn nếu không phải Admin) -->
        <div id="adminSetupBtn" class="hidden flex gap-3 bg-slate-900/60 p-3 rounded border border-slate-800 items-center">
            <span class="text-xs font-bold text-red-500 uppercase tracking-widest px-2">Admin Control</span>
            <button onclick="openCreateTournamentModal()" class="bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase px-3 py-1.5 rounded transition">
                Khởi tạo/Reset Giải Đấu
            </button>
        </div>

        <!-- SECTION: BRACKET -->
        <section class="bg-slate-900/40 border border-slate-800/80 rounded-lg p-6 relative overflow-hidden">
            <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <h2 class="font-teko text-xl tracking-wider font-bold uppercase text-white">Official VCT Knockout Bracket</h2>
                </div>
                <span class="text-[10px] font-mono text-slate-500 uppercase">Live Sync Active</span>
            </div>

            <!-- BRACKET ENGINE VIEW -->
            <div class="bracket-wrapper">
                <!-- Vòng 1 -->
                <div id="round1Col" class="bracket-col">
                    <!-- Render tự động bởi JS -->
                    <div class="text-slate-500 text-xs italic">Đang tải nhánh đấu...</div>
                </div>

                <!-- Vòng Chung Kết / Playoffs -->
                <div class="bracket-col">
                    <div class="vct-match-card border-slate-800 opacity-60 p-4 text-center border-dashed">
                        <span class="font-teko text-lg uppercase font-bold text-slate-400 block tracking-wider">Vào Playoffs / Finals</span>
                        <span class="text-[10px] font-mono text-slate-500 block mt-1">TBD (Chờ thắng Vòng 1)</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION: PICK & BAN / TRẬN ĐẤU ĐANG DIỄN RA -->
        <section id="secPickBan" class="bg-slate-900/40 border border-slate-800/80 rounded-lg p-6 hidden">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                <h3 class="font-teko text-lg tracking-wider font-bold uppercase text-white">Map Veto & Pick Phase</h3>
                <span id="txtPickStatus" class="text-xs font-mono text-cyan-400 bg-cyan-950/40 px-2.5 py-0.5 rounded border border-cyan-800/50">Trạng thái: Đang chờ</span>
            </div>
            <div id="pickBanContainer" class="space-y-4">
                <!-- Nội dung Veto sẽ nạp vào đây -->
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-vct-darker border-t border-vct-border py-3 text-center text-xs text-slate-500 font-mono">
        VCT Tournament System &bull; Clean Esports UI
    </footer>

    <!-- SCRIPT LOGIC (Giữ nguyên các hàm fetch API hệ thống của bạn) -->
    <script>
        let currentUser = null;
        let allTeams = [];
        let activeMatchForUser = null;

        async function initApp() {
            try {
                // Giả lập lấy thông tin user hiện tại (thay thế bằng API thực tế của hệ thống bạn)
                const userRes = await fetch('/api/current-user');
                currentUser = await userRes.json();
                document.getElementById('txtCurrentUser').innerText = `${currentUser.username} (${currentUser.role})`;
            } catch (e) {
                console.warn("Không thể tải thông tin user, dùng mặc định khách.");
                currentUser = { username: "Guest", role: "USER", teamId: null };
            }
            await loadDashboard();
            // Thiết lập interval làm mới dữ liệu realtime nếu cần
            setInterval(loadDashboard, 5000);
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                const matches = data.matches || [];
                allTeams = data.teams || [];

                const round1Col = document.getElementById('round1Col');
                const adminSetupBtn = document.getElementById('adminSetupBtn');
                const isAdmin = currentUser && currentUser.role === 'ADMIN';

                if (isAdmin) adminSetupBtn.classList.remove('hidden');

                if (matches.length === 0) {
                    round1Col.innerHTML = `<p class="text-slate-500 text-xs italic">Chưa tạo sơ đồ thi đấu.</p>`;
                    document.getElementById('secPickBan').classList.add('hidden');
                    return;
                }

                let html = '';
                activeMatchForUser = null;

                matches.forEach((m, idx) => {
                    const isMyTeamA = currentUser.teamId === m.teamA?.id;
                    const isMyTeamB = currentUser.teamId === m.teamB?.id;

                    if ((m.status === 'PICKING_MAP1' || m.status === 'PICKING_MAP2') && (isMyTeamA || isMyTeamB || isAdmin)) {
                        activeMatchForUser = m;
                    }

                    // Map Veto Badges
                    let mapsHtml = '';
                    if (m.bo3Maps && m.bo3Maps.length > 0) {
                        mapsHtml = `<div class="mt-2.5 pt-2 border-t border-slate-800 space-y-1">`;
                        m.bo3Maps.forEach((mp, i) => {
                            mapsHtml += `
                                <div class="flex items-center justify-between text-[11px] bg-slate-950 px-2.5 py-1 rounded border border-slate-800/60">
                                    <span class="font-mono font-bold text-slate-300">M${i+1}: <span class="text-cyan-400">${mp.name}</span></span>
                                    <span class="text-[10px] font-mono text-slate-400"><b class="text-emerald-400">A</b>:${mp.sideA} | <b class="text-amber-400">B</b>:${mp.sideB}</span>
                                </div>`;
                        });
                        mapsHtml += `</div>`;
                    } else {
                        mapsHtml = `<div class="mt-2 text-[11px] text-slate-500 font-mono italic text-center bg-slate-950/40 py-1 rounded">Chờ Veto Map...</div>`;
                    }

                    const cardStateClass = m.status === 'READY' ? 'ready' : (m.status !== 'WAITING' ? 'active' : '');
                    const statusBadgeColor = m.status === 'READY' ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30' : 'bg-slate-800/80 text-slate-400 border-slate-700';

                    html += `
                        <div class="vct-match-card ${cardStateClass} p-3.5">
                            <!-- Header Card -->
                            <div class="flex justify-between items-center mb-2.5 pb-1.5 border-b border-slate-800">
                                <span class="font-mono text-[11px] font-bold text-slate-400 tracking-wider">MATCH #${idx + 1}</span>
                                <span class="text-[9px] font-mono px-2 py-0.5 rounded border uppercase font-bold tracking-wider ${statusBadgeColor}">
                                    ${m.status}
                                </span>
                            </div>

                            <!-- Teams & Scores -->
                            <div class="space-y-1.5">
                                <div class="flex justify-between items-center bg-slate-950 px-2.5 py-1.5 rounded border border-slate-800/50">
                                    <span class="font-bold text-xs ${m.scoreA > m.scoreB ? 'text-red-400' : 'text-slate-200'}">${m.teamA?.name || 'TBD'}</span>
                                    <span class="font-teko text-xl font-bold leading-none ${m.scoreA > m.scoreB ? 'text-red-500' : 'text-slate-400'}">${m.scoreA}</span>
                                </div>
                                <div class="flex justify-between items-center bg-slate-950 px-2.5 py-1.5 rounded border border-slate-800/50">
                                    <span class="font-bold text-xs ${m.scoreB > m.scoreA ? 'text-red-400' : 'text-slate-200'}">${m.teamB?.name || 'TBD'}</span>
                                    <span class="font-teko text-xl font-bold leading-none ${m.scoreB > m.scoreA ? 'text-red-500' : 'text-slate-400'}">${m.scoreB}</span>
                                </div>
                            </div>

                            <!-- Maps -->
                            ${mapsHtml}

                            ${isAdmin && m.status === 'WAITING' ? `
                                <button onclick="startMatchByAdmin('${m.id}')" class="w-full mt-3 bg-red-600 hover:bg-red-500 text-white text-[11px] py-1.5 rounded font-bold uppercase transition tracking-wider">
                                    ADMIN: Mở Pick Map
                                </button>
                            ` : ''}
                        </div>
                    `;
                });

                round1Col.innerHTML = html;
                renderPickSection();
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu bảng đấu:", err);
            }
        }

        function renderPickSection() {
            const sec = document.getElementById('secPickBan');
            const container = document.getElementById('pickBanContainer');
            if (!activeMatchForUser) {
                sec.classList.add('hidden');
                return;
            }
            sec.classList.remove('hidden');
            // Logic render khu vực pick/ban chi tiết (tuỳ thuộc vào cấu trúc API hiện tại của bạn)
            container.innerHTML = `<p class="text-xs font-mono text-slate-300">Đang có trận đấu yêu cầu thao tác Veto/Pick map cho trận <b class="text-red-400">Match ID: ${activeMatchForUser.id}</b>.</p>`;
        }

        async function startMatchByAdmin(matchId) {
            await fetch(`/api/admin/match/${matchId}/start`, { method: 'POST' });
            loadDashboard();
        }

        async function openCreateTournamentModal() {
            if(confirm("Bạn có chắc chắn muốn khởi tạo lại giải đấu?")) {
                await fetch('/api/admin/tournament/reset', { method: 'POST' });
                loadDashboard();
            }
        }

        function logout() {
            window.location.href = '/logout';
        }

        // Khởi chạy
        initApp();
    </script>
</body>
</html>
