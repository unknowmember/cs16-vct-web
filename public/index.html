<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCT CS 1.6 Esports Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Teko&family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #080a0f; font-family: 'Titillium Web', sans-serif; color: #e2e8f0; }
        .font-teko { font-family: 'Teko', sans-serif; }
        .vct-border { border: 1px solid rgba(239, 68, 68, 0.3); }
        .vct-glass { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(16px); }
        .vct-glow { box-shadow: 0 0 25px rgba(239, 68, 68, 0.2); }
        .bracket-line { position: relative; }
        .bracket-line::after { content: ''; position: absolute; right: -2rem; top: 50%; width: 2rem; height: 2px; background: #334155; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">

        <!-- HEADER -->
        <header class="vct-glass p-5 rounded-xl border-b-2 border-red-500 shadow-2xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-black font-black font-teko text-2xl px-3 py-0.5 rounded tracking-wider">VCT</div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wider uppercase text-white">CS 1.6 TOURNAMENT HUD</h1>
                    <p id="userStatus" class="text-xs text-slate-400 font-mono">Chưa đăng nhập</p>
                </div>
            </div>
            <div id="tokenCard" class="hidden bg-slate-900 border border-slate-700 px-4 py-1.5 rounded text-right">
                <span class="text-[10px] text-slate-400 uppercase tracking-widest block">PLAYER TOKEN</span>
                <span id="tokenDisplay" class="font-mono text-yellow-400 font-bold text-sm"></span>
            </div>
        </header>

        <!-- SEC 1: AUTH -->
        <div id="secAuth" class="max-w-md mx-auto vct-glass p-6 rounded-xl border border-slate-800 space-y-4">
            <h2 class="text-lg font-black text-red-500 uppercase tracking-wider text-center">ĐĂNG NHẬP / ĐĂNG KÝ</h2>
            <input id="authUsername" type="text" placeholder="Tên tài khoản" class="w-full bg-slate-900 p-2.5 rounded border border-slate-700 text-sm focus:border-red-500 outline-none">
            <input id="authPassword" type="password" placeholder="Mật khẩu" class="w-full bg-slate-900 p-2.5 rounded border border-slate-700 text-sm focus:border-red-500 outline-none">
            <div class="flex gap-2">
                <button onclick="login()" class="flex-1 bg-red-600 hover:bg-red-500 font-bold py-2 rounded text-sm transition">ĐĂNG NHẬP</button>
                <button onclick="register()" class="flex-1 bg-slate-800 hover:bg-slate-700 font-bold py-2 rounded text-sm transition">ĐĂNG KÝ</button>
            </div>
        </div>

        <!-- SEC 2: TEAM SETUP -->
        <div id="secTeam" class="hidden max-w-md mx-auto vct-glass p-6 rounded-xl border border-slate-800 space-y-4">
            <h2 class="text-lg font-black text-yellow-400 uppercase tracking-wider text-center">TẠO HẶC VÀO TEAM</h2>
            <input id="teamName" type="text" placeholder="Tên Team" class="w-full bg-slate-900 p-2.5 rounded border border-slate-700 text-sm focus:border-yellow-500 outline-none">
            <input id="teamPass" type="password" placeholder="Mật khẩu Team" class="w-full bg-slate-900 p-2.5 rounded border border-slate-700 text-sm focus:border-yellow-500 outline-none">
            <div class="flex gap-2">
                <button onclick="createTeam()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 font-bold py-2 rounded text-sm transition">TẠO TEAM</button>
                <button onclick="joinTeam()" class="flex-1 bg-yellow-600 hover:bg-yellow-500 font-bold py-2 rounded text-sm transition">VÀO TEAM</button>
            </div>
        </div>

        <!-- SEC 3: BRACKET HUD (SƠ ĐỒ CÂY CHUYÊN NGHIỆP) -->
        <div id="secTournament" class="hidden vct-glass p-6 rounded-xl border border-slate-800 space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>
                    <h2 class="font-teko text-2xl font-black text-white tracking-wider">TOURNAMENT BRACKET HUD</h2>
                </div>
                <button id="adminSetupBtn" onclick="toggleAdminPanel()" class="hidden bg-red-600 hover:bg-red-500 text-xs px-3 py-1.5 rounded font-bold uppercase">ADMIN: Xếp Cặp Đấu</button>
            </div>

            <!-- ADMIN SETUP PANEL -->
            <div id="adminPanel" class="hidden bg-slate-950 p-4 rounded-lg border border-red-500/50 space-y-3">
                <h3 class="text-xs font-bold text-yellow-400 uppercase">Xếp Cặp Đấu Vòng 1</h3>
                <div id="pairingSlots" class="space-y-2"></div>
                <button onclick="saveCustomBracket()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded text-xs font-bold uppercase">Chốt Sơ Đồ & Khởi Tạo</button>
            </div>

            <!-- BRACKET TREE DISPLAY -->
            <div class="overflow-x-auto pb-4">
                <div id="bracketTree" class="flex items-center gap-8 min-w-[700px]"></div>
            </div>
        </div>

        <!-- SEC 4: CHỈ HIỂN THỊ 1 Ô DÀNH CHO TEAM ĐANG PICK MAP -->
        <div id="secPickBan" class="hidden vct-glass p-6 rounded-xl border-2 border-yellow-500/60 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-teko text-2xl font-black text-yellow-400 tracking-wider">MAP PICK & BAN SYSTEM</h2>
                <span id="turnBadge" class="bg-yellow-500/20 text-yellow-400 text-xs font-bold px-3 py-1 rounded-full border border-yellow-500/40">LƯỢT PICK MAP</span>
            </div>
            
            <p id="activeMatchNotice" class="text-xs text-slate-300 font-mono"></p>

            <!-- SINGLE ACTIVE PICK CARD -->
            <div id="activePickCard" class="bg-slate-950 p-5 rounded-lg border border-slate-800 space-y-4"></div>
        </div>

        <!-- SEC 5: TEAMS -->
        <div id="secTeamList" class="hidden vct-glass p-6 rounded-xl border border-slate-800 space-y-4">
            <h2 class="font-teko text-2xl font-black text-cyan-400 tracking-wider">DANH SÁCH ĐỘI THAM GIA</h2>
            <div id="teamsContainer" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

    </div>

    <script>
        let currentUser = null;
        let allTeams = [];
        let activeMatchForUser = null;
        const mapPool = ["de_dust2", "de_inferno", "de_nuke", "de_train", "de_aztec", "de_cbble", "de_prodigy"];

        function updateUIFlow() {
            if (!currentUser) {
                document.getElementById('secAuth').classList.remove('hidden');
                document.getElementById('secTeam').classList.add('hidden');
                document.getElementById('secTournament').classList.add('hidden');
                document.getElementById('secPickBan').classList.add('hidden');
                document.getElementById('secTeamList').classList.add('hidden');
                document.getElementById('tokenCard').classList.add('hidden');
                return;
            }

            document.getElementById('secAuth').classList.add('hidden');
            document.getElementById('tokenCard').classList.remove('hidden');
            document.getElementById('tokenDisplay').innerText = currentUser.token;
            document.getElementById('userStatus').innerText = `Player: ${currentUser.username} (${currentUser.role})`;

            const isAdmin = currentUser.role === 'ADMIN';
            const hasTeam = !!currentUser.teamId;

            if (!hasTeam && !isAdmin) {
                document.getElementById('secTeam').classList.remove('hidden');
                document.getElementById('secTournament').classList.add('hidden');
            } else {
                document.getElementById('secTeam').classList.add('hidden');
                document.getElementById('secTournament').classList.remove('hidden');
                document.getElementById('secTeamList').classList.remove('hidden');
                loadDashboard();
                loadTeamsList();
            }
        }

        async function login() {
            const u = document.getElementById('authUsername').value;
            const p = document.getElementById('authPassword').value;
            const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: u, password: p }) });
            const data = await res.json();
            if (data.error) return alert(data.error);
            currentUser = data.user;
            updateUIFlow();
        }

        async function register() {
            const u = document.getElementById('authUsername').value;
            const p = document.getElementById('authPassword').value;
            const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: u, password: p }) });
            const data = await res.json();
            if (data.error) return alert(data.error);
            currentUser = data.user;
            updateUIFlow();
        }

        async function createTeam() {
            const name = document.getElementById('teamName').value;
            const pass = document.getElementById('teamPass').value;
            const res = await fetch('/api/team/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: currentUser.id, teamName: name, teamPassword: pass }) });
            const data = await res.json();
            if (data.error) return alert(data.error);
            currentUser.teamId = data.team.id;
            updateUIFlow();
        }

        async function joinTeam() {
            const name = document.getElementById('teamName').value;
            const pass = document.getElementById('teamPass').value;
            const res = await fetch('/api/team/join', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: currentUser.id, teamName: name, teamPassword: pass }) });
            const data = await res.json();
            if (data.error) return alert(data.error);
            currentUser.teamId = data.team.id;
            updateUIFlow();
        }

        async function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                const res = await fetch('/api/teams');
                allTeams = await res.json();
                renderPairingInputs();
            }
        }

        function renderPairingInputs() {
            const container = document.getElementById('pairingSlots');
            const matchCount = Math.max(1, Math.ceil(allTeams.length / 2));
            let html = '';
            for (let i = 0; i < matchCount; i++) {
                const opts = allTeams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
                html += `
                    <div class="flex items-center gap-2 bg-slate-900 p-2 rounded border border-slate-800">
                        <span class="text-xs font-bold text-slate-400 w-16">Trận ${i + 1}:</span>
                        <select id="slot_${i}_A" class="bg-slate-800 text-xs p-1.5 rounded text-white flex-1">${opts}</select>
                        <span class="text-xs font-bold text-red-500">VS</span>
                        <select id="slot_${i}_B" class="bg-slate-800 text-xs p-1.5 rounded text-white flex-1">${opts}</select>
                    </div>`;
            }
            container.innerHTML = html;
        }

        async function saveCustomBracket() {
            const matchCount = Math.max(1, Math.ceil(allTeams.length / 2));
            const pairings = [];
            for (let i = 0; i < matchCount; i++) {
                pairings.push({ teamAId: document.getElementById(`slot_${i}_A`).value, teamBId: document.getElementById(`slot_${i}_B`).value });
            }
            const res = await fetch('/api/admin/setup-bracket', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, pairings }) });
            const data = await res.json();
            if (data.error) return alert(data.error);
            document.getElementById('adminPanel').classList.add('hidden');
            loadDashboard();
        }

        async function startMatchByAdmin(matchId) {
            const res = await fetch('/api/admin/start-match', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id, matchId }) });
            const data = await res.json();
            if (data.error) return alert(data.error);
            loadDashboard();
        }

        async function loadDashboard() {
            const res = await fetch('/api/dashboard');
            const data = await res.json();
            const matches = data.matches || [];

            const bracketTree = document.getElementById('bracketTree');
            const adminSetupBtn = document.getElementById('adminSetupBtn');
            const isAdmin = currentUser && currentUser.role === 'ADMIN';

            if (isAdmin) adminSetupBtn.classList.remove('hidden');

            if (matches.length === 0) {
                bracketTree.innerHTML = `<p class="text-slate-500 text-xs">Chưa có trận đấu nào.</p>`;
                document.getElementById('secPickBan').classList.add('hidden');
                return;
            }

            let html = `<div class="flex flex-col gap-6">`;
            activeMatchForUser = null;

            matches.forEach(m => {
                const isMyTeamA = currentUser.teamId === m.teamA.id;
                const isMyTeamB = currentUser.teamId === m.teamB.id;

                if ((m.status === 'PICKING_MAP1' || m.status === 'PICKING_MAP2') && (isMyTeamA || isMyTeamB || isAdmin)) {
                    activeMatchForUser = m;
                }

                // HUD CHUYÊN NGHIỆP CỦA CÂY SƠ ĐỒ
                let statusBadge = `<span class="bg-slate-800 text-slate-400 text-[10px] px-2 py-0.5 rounded font-bold uppercase">Chờ Khởi Động</span>`;
                if (m.status === 'PICKING_MAP1') statusBadge = `<span class="bg-amber-950 text-amber-400 text-[10px] px-2 py-0.5 rounded font-bold uppercase border border-amber-800/50 animate-pulse">${m.teamA.name} Pick Map 1</span>`;
                if (m.status === 'PICKING_MAP2') statusBadge = `<span class="bg-amber-950 text-amber-400 text-[10px] px-2 py-0.5 rounded font-bold uppercase border border-amber-800/50 animate-pulse">${m.teamB.name} Pick Map 2</span>`;
                if (m.status === 'READY') statusBadge = `<span class="bg-emerald-950 text-emerald-400 text-[10px] px-2 py-0.5 rounded font-bold uppercase border border-emerald-800/50">Sẵn Sàng BO3</span>`;

                // HIỂN THỊ ĐỦ 3 MAP TRÊN SƠ ĐỒ CÂY
                let mapsListHtml = `<div class="text-[10px] text-slate-500 italic mt-2">Đang chờ Ban/Pick Map...</div>`;
                if (m.bo3Maps && m.bo3Maps.length > 0) {
                    mapsListHtml = `<div class="mt-2 space-y-1 bg-slate-950 p-2 rounded border border-slate-800/80 font-mono text-[11px]">`;
                    m.bo3Maps.forEach((mp, i) => {
                        mapsListHtml += `<div class="flex justify-between items-center text-slate-300">
                            <span><b>M${i+1}:</b> ${mp.name}</span>
                            <span class="text-amber-400 text-[10px] font-bold">(${mp.picker}): A[${mp.sideA}] - B[${mp.sideB}]</span>
                        </div>`;
                    });
                    mapsListHtml += `</div>`;
                }

                html += `
                    <div class="w-80 bg-slate-900 rounded-xl border border-slate-800 shadow-xl overflow-hidden hover:border-slate-700 transition">
                        <div class="bg-slate-950 px-3 py-1.5 flex justify-between items-center border-b border-slate-800">
                            <span class="font-mono text-[11px] text-slate-400 font-bold">${m.id}</span>
                            ${statusBadge}
                        </div>
                        <div class="p-3 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-white">${m.teamA.name}</span>
                                <span class="font-teko text-xl font-bold text-cyan-400">${m.scoreA}</span>
                            </div>
                            <div class="border-t border-slate-800/60"></div>
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-white">${m.teamB.name}</span>
                                <span class="font-teko text-xl font-bold text-cyan-400">${m.scoreB}</span>
                            </div>
                            ${mapsListHtml}
                            ${isAdmin && m.status === 'WAITING' ? `
                                <button onclick="startMatchByAdmin('${m.id}')" class="w-full mt-2 bg-red-600 hover:bg-red-500 text-white text-xs py-1 rounded font-bold uppercase transition">
                                    ADMIN: Mở Pick Map
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            bracketTree.innerHTML = html;

            // HANDLE PICK/BAN SECTION FOR USER & ADMIN
            renderPickSection();
        }

        function renderPickSection() {
            const secPickBan = document.getElementById('secPickBan');
            const activePickCard = document.getElementById('activePickCard');
            const notice = document.getElementById('activeMatchNotice');

            if (!activeMatchForUser) {
                secPickBan.classList.add('hidden');
                return;
            }

            secPickBan.classList.remove('hidden');
            const m = activeMatchForUser;
            const isTeamA = currentUser.teamId === m.teamA.id;
            const isTeamB = currentUser.teamId === m.teamB.id;
            const isAdmin = currentUser.role === 'ADMIN';

            notice.innerText = `Trận đấu: ${m.teamA.name} VS ${m.teamB.name}`;

            // ADMIN VÀ NGƯỜI XEM CÓ CHẾ ĐỘ XEM CHỦ ĐỘNG
            if (isAdmin || (!isTeamA && !isTeamB)) {
                let adminMsg = m.status === 'PICKING_MAP1' 
                    ? `Đang chờ <b>${m.teamA.name}</b> chọn Map 1...` 
                    : `Đang chờ <b>${m.teamB.name}</b> chọn Map 2... (Map 3 Decider sẽ tự sinh)`;
                activePickCard.innerHTML = `<div class="p-4 text-center text-sm text-yellow-400 bg-slate-900 rounded border border-yellow-500/30">${adminMsg}</div>`;
                return;
            }

            // XỬ LÝ LƯỢT CHỌN CHỈ HIỂN THỊ 1 Ô DUY NHẤT
            if (m.status === 'PICKING_MAP1') {
                if (isTeamA) {
                    const opts = mapPool.map(mp => `<option value="${mp}">${mp}</option>`).join('');
                    activePickCard.innerHTML = `
                        <p class="text-xs font-bold text-cyan-400 uppercase">Lượt Team Bạn (${m.teamA.name}): Chọn Map 1</p>
                        <div class="space-y-3">
                            <div>
                                <label class="text-[11px] text-slate-400 block mb-1">Chọn Map 1:</label>
                                <select id="inputMap1" class="w-full bg-slate-900 p-2 rounded border border-slate-700 text-xs">${opts}</select>
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-400 block mb-1">Chọn Phe Khởi Đầu Map 1:</label>
                                <select id="inputSideA1" class="w-full bg-slate-900 p-2 rounded border border-slate-700 text-xs">
                                    <option value="CT">Counter-Terrorists (CT)</option>
                                    <option value="TERRORIST">Terrorists (T)</option>
                                </select>
                            </div>
                            <button onclick="submitPickMap1()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded text-xs uppercase">Xác Nhận Map 1</button>
                        </div>`;
                } else {
                    activePickCard.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">Đang chờ <b>${m.teamA.name}</b> chọn Map 1...</div>`;
                }
            } else if (m.status === 'PICKING_MAP2') {
                if (isTeamB) {
                    const map1Name = m.bo3Maps[0].name;
                    const availMaps = mapPool.filter(mp => mp !== map1Name);
                    const opts = availMaps.map(mp => `<option value="${mp}">${mp}</option>`).join('');

                    activePickCard.innerHTML = `
                        <p class="text-xs font-bold text-red-400 uppercase">Lượt Team Bạn (${m.teamB.name}): Chọn Map 2</p>
                        <div class="space-y-3">
                            <div>
                                <label class="text-[11px] text-slate-400 block mb-1">Chọn Map 2 (Khác ${map1Name}):</label>
                                <select id="inputMap2" class="w-full bg-slate-900 p-2 rounded border border-slate-700 text-xs">${opts}</select>
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-400 block mb-1">Chọn Phe Khởi Đầu Map 2:</label>
                                <select id="inputSideB2" class="w-full bg-slate-900 p-2 rounded border border-slate-700 text-xs">
                                    <option value="CT">Counter-Terrorists (CT)</option>
                                    <option value="TERRORIST">Terrorists (T)</option>
                                </select>
                            </div>
                            <button onclick="submitPickMap2()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded text-xs uppercase">Xác Nhận Map 2 & Tự Động Tạo Decider Map 3</button>
                        </div>`;
                } else {
                    activePickCard.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">Đang chờ <b>${m.teamB.name}</b> chọn Map 2...</div>`;
                }
            }
        }

        async function submitPickMap1() {
            const map1 = document.getElementById('inputMap1').value;
            const sideA1 = document.getElementById('inputSideA1').value;
            const res = await fetch('/api/match/pick-map1', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, matchId: activeMatchForUser.id, map1, sideA1 })
            });
            const data = await res.json();
            if (data.error) return alert(data.error);
            loadDashboard();
        }

        async function submitPickMap2() {
            const map2 = document.getElementById('inputMap2').value;
            const sideB2 = document.getElementById('inputSideB2').value;
            const res = await fetch('/api/match/pick-map2', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, matchId: activeMatchForUser.id, map2, sideB2 })
            });
            const data = await res.json();
            if (data.error) return alert(data.error);
            loadDashboard();
        }

        async function loadTeamsList() {
            const res = await fetch('/api/teams');
            const teams = await res.json();
            const container = document.getElementById('teamsContainer');
            container.innerHTML = teams.map(t => `
                <div class="bg-slate-900 p-3 rounded border border-slate-800">
                    <h3 class="font-bold text-white text-sm">${t.name}</h3>
                    <p class="text-[11px] text-slate-400">Thành viên: ${t.members.join(', ') || 'Trống'}</p>
                </div>
            `).join('');
        }

        updateUIFlow();
    </script>
</body>
</html>
